@keyframes fo-flow{0%{transform:translateX(0px);opacity:0}20%{opacity:.45}80%{opacity:.3}100%{transform:translateX(-460px);opacity:0}}
.fo-rotate{animation-name:fo-rotate;animation-timing-function:linear;animation-direction:normal}
@keyframes fo-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fo-strobe{animation-name:fo-strobe;animation-timing-function:linear;animation-direction:normal}
@keyframes fo-strobe{0%,32%,100%{opacity:.18}8%{opacity:1}}
.fo-redwash{animation-name:fo-redwash}
@keyframes fo-redwash{from{opacity:.4}to{opacity:1}}
.fo-firelight{animation-name:fo-firelight}
@keyframes fo-firelight{from{opacity:.7;transform:scale(.97)}to{opacity:1;transform:scale(1.04)}}
.fo-ember{animation-name:fo-ember;animation-timing-function:linear;animation-direction:normal}
@keyframes fo-ember{0%{transform:translate(0px,0px);opacity:0}15%{opacity:1}100%{transform:translate(var(--ex,-200px),var(--ey,0px));opacity:0}}
.fo-haze{animation-name:fo-haze}
@keyframes fo-haze{from{transform:translateX(0px)}to{transform:translateX(-160px)}}
.fo-shake{animation-name:fo-shake;animation-timing-function:linear;animation-direction:normal}
@keyframes fo-shake{0%,100%{transform:translate(0px,0px)}20%{transform:translate(calc(var(--shake,0) * -3px),calc(var(--shake,0) * 2px))}40%{transform:translate(calc(var(--shake,0) * 2px),calc(var(--shake,0) * -2px))}60%{transform:translate(calc(var(--shake,0) * -2px),calc(var(--shake,0) * -1px))}80%{transform:translate(calc(var(--shake,0) * 3px),calc(var(--shake,0) * 1px))}}
.fo-streak{animation:fo-streak var(--d,1s) cubic-bezier(.55,0,1,.45) var(--delay,0s) both}
@keyframes fo-streak{0%{transform:translateX(var(--from,900px)) scaleX(.3);opacity:0}30%{opacity:1}100%{transform:translateX(16px) scaleX(2.6);opacity:0}}
.fo-pen{animation:fo-pen 1.7s cubic-bezier(.45,0,.25,1) both}
@keyframes fo-pen{0%{transform:rotate(0deg);opacity:1}88%{opacity:1}100%{transform:rotate(360deg);opacity:0}}
.fo-dip{pointer-events:none;animation:fo-dip 660ms ease-in-out both}
@keyframes fo-dip{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.fo-watermark{position:absolute;top:1.3cqw;right:1.7cqw;font-size:clamp(9px,.8cqw,13px);letter-spacing:.04em;color:${h.hint};pointer-events:none}
.fo-hud{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6em 1.6em;padding:2.4em 1.8em 1.3em;font-size:clamp(11px,1cqw,16px);background:linear-gradient(to top,rgba(3,8,23,.78),rgba(3,8,23,0));transition:opacity 450ms ease}
.fo-root[data-idle="true"] .fo-hud{opacity:0}
.fo-progress{display:flex;align-items:center;gap:1.1em;min-width:0}
.fo-scene{font-family:${fl.display};font-weight:600;font-size:.86em;letter-spacing:.14em;text-transform:uppercase;color:${h.textSoft};white-space:nowrap}
.fo-dots{display:flex;align-items:center;gap:.9em}
.fo-group{display:flex;gap:.38em}
.fo-dot{width:.55em;height:.55em;border-radius:50%;background:rgba(169,196,235,.25);transition:background-color 300ms ease,box-shadow 300ms ease}
.fo-dot[data-state="done"]{background:rgba(169,196,235,.7)}
.fo-dot[data-state="current"]{background:${h.fireGlow};box-shadow:0 0 0 .22em rgba(255,178,91,.22)}
.fo-count{color:${h.hint};font-size:.86em;font-variant-numeric:tabular-nums;white-space:nowrap}
.fo-hint{margin:0;color:${h.hint};font-size:.95em;flex:1 1 auto;text-align:right;min-width:0}
.fo-buttons{display:flex;gap:.5em}
.fo-btn{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:2.6em;padding:0 1em;border:1px solid rgba(169,196,235,.32);border-radius:.55em;background:rgba(7,23,63,.6);color:${h.hullLight};font:600 1em/1 ${fl.text};cursor:pointer;transition:border-color 160ms ease,background-color 160ms ease,opacity 160ms ease}
.fo-btn:hover:not(:disabled){border-color:${h.hullLight};background:rgba(19,42,82,.9)}
.fo-btn:active:not(:disabled){transform:translateY(1px)}
.fo-btn:disabled{opacity:.35;cursor:default}
.fo-btn:focus-visible{outline:2px solid ${h.focusRing};outline-offset:2px}
.fo-btn-next{background:rgba(169,196,235,.16);border-color:rgba(232,240,251,.5)}
.fo-btn-icon{padding:0 .75em}
.fo-btn svg{width:1.15em;height:1.15em;display:block}
.fo-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@container (max-width: 560px){.fo-hint,.fo-scene,.fo-btn span{display:none}}
